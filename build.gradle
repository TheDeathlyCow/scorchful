plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    mavenCentral()
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.shedaniel.me/" }
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
    maven { url "https://jitpack.io/" }
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

loom {
    splitEnvironmentSourceSets()
}

fabricApi {
    configureDataGeneration() {
        createSourceSet = true
        client = true
        modId = "scorchful-datagen"
    }
    configureTests() {
        createSourceSet = true
        modId = "scorchful-test"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/scorchful.accesswidener")

    runs {
        gametestClient {
            client()
            ideConfigGenerated project.rootProject == project
            name = "GameTest Client"
            source sourceSets.gametest
        }
        gametestServer {
            server()
            ideConfigGenerated project.rootProject == project
            name = "GameTest Server"
            source sourceSets.gametest
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Uncomment the following line to enable the deprecated Fabric API modules.
    // These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

    // modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"

    modImplementation "com.terraformersmc:modmenu:${project.mod_menu_version}"

    modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}-fabric"

    modImplementation "com.github.thedeathlycow:thermoo:v${project.thermoo_version}"

    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    // modImplementation "org.ladysnake:satin:${satin_version}"

    // temporarily using cursemaven since modrinth is delayed
    modImplementation "maven.modrinth:immersive-storms:${project.immersive_storms_version}"
    include "maven.modrinth:immersive-storms:${project.immersive_storms_version}"

    gametestImplementation "org.mockito:mockito-core:3.+"
    // still not updated :(
    // include "org.ladysnake:satin:${satin_version}"

    modCompileOnly("maven.modrinth:dehydration:${project.dehydration_version}") { transitive = false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

publishMods {
    changelog = file("changelogs/${mod_version}.md").text
    type = BETA

    file = remapJar.archiveFile
    additionalFiles.from(remapSourcesJar.archiveFile)
    displayName = "Scorchful ${mod_version}"

    modLoaders.add("fabric")
    modLoaders.add("quilt")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "981400"
        minecraftVersions.addAll("1.21.9")

        javaVersions.add(JavaVersion.VERSION_21)

        clientRequired = true
        serverRequired = true

        requires("fabric-api", "cardinal-components-api", "thermoo", "yacl")

        optional("thermoo-patches", "frostiful", "modmenu", "dehydration")

        embeds("immersive-storms")
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "SZQ5qcdn"
        minecraftVersions.addAll("1.21.9")

        requires("fabric-api", "cardinal-components-api", "thermoo", "yacl")

        optional("thermoo-patches", "frostiful", "modmenu", "dehydration")

        embeds("immersive-storms")
    }
}